[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas-interval-join"
version = "0.1.0"
description = "Efficient O(n + m) interval / range join for sorted pandas DataFrames"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["pandas", "dataframe", "join", "merge", "interval", "range", "two-pointer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/laurenzlrz/PandasIntervalJoin"
Repository = "https://github.com/laurenzlrz/PandasIntervalJoin"
"Bug Tracker" = "https://github.com/laurenzlrz/PandasIntervalJoin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pandas_interval_join*"]

[tool.setuptools.package-data]
pandas_interval_join = ["py.typed"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
